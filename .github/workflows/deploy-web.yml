name: Deploy Web to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: # Allows manual triggering

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Starting Vercel Deployment
        run: |
          echo "=========================================="
          echo "🌐 Deploying SplitBill Web App to Vercel"
          echo "=========================================="
          echo "📅 Triggered at: $(date)"
          echo "🔀 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"

      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📚 Install dependencies
        working-directory: ./app
        run: |
          echo "📚 Installing npm dependencies..."
          npm install
          echo "✅ Dependencies installed successfully!"

      - name: 🏗️ Build Expo Web
        working-directory: ./app
        env:
          EXPO_PLATFORM: web
        run: |
          echo "🏗️ Building Expo web app..."
          npx expo export --platform web
          echo "✅ Expo web build completed!"

      - name: 🔧 Install Vercel CLI
        run: |
          echo "🔧 Installing Vercel CLI..."
          npm install -g vercel@latest
          echo "✅ Vercel CLI installed: $(vercel --version)"

      - name: 🚀 Deploy to Vercel
        working-directory: ./app
        id: deploy
        run: |
          echo "🚀 Deploying to Vercel..."
          DEPLOYMENT_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "✅ Deployment successful!"
          echo "🌐 URL: $DEPLOYMENT_URL"

      - name: 📋 Deployment Summary
        run: |
          echo "=========================================="
          echo "✅ DEPLOYMENT SUCCESSFUL!"
          echo "=========================================="
          echo "🌐 Live URL: ${{ steps.deploy.outputs.deployment_url }}"
          echo "📅 Completed at: $(date)"
          echo "=========================================="
